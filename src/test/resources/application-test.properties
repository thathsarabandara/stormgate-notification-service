# Test Configuration for Notification Service

# Application Configuration
spring.application.name=notification-service-test
server.port=8003
server.servlet.context-path=/api/v1/notification

# H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate
# Disable Kafka auto-startup for tests
spring.kafka.listener.poll-timeout=3000
spring.kafka.producer.acks=all

# JWT Configuration
jwt.secret=cfddd580c0caa2e2cad8b560cec782369e73960d0089949d314ba4ac0062ba803ce9201b0da1a80781b7815dc0f99f3e74
jwt.expiration=3600000

# Mail Configuration (Mock SMTP)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging Configuration
logging.level.root=WARN
logging.level.com.thathsara.notification_service=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Test Profile Active
