# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval-ms=1000
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.session-timeout-ms=30000

# Kafka Topics
kafka.topics.user-events=user-events
kafka.topics.order-events=order-events
kafka.topics.payment-events=payment-events
kafka.topics.refund-events=refund-events

# Actuator Configuration (for health checks and metrics)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.thathsara.notification_service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/notification-service.log

# Server Configuration
server.max-http-header-size=16KB
server.tomcat.max-connections=200
server.tomcat.threads.max=50
server.compression.enabled=true
server.compression.min-response-size=1024

# Spring Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Thymeleaf Configuration (for email templates)
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/

# Actuator default path
management.endpoints.web.base-path=/actuator


