# Application Configuration
spring.application.name=notification-service
server.port=8003
server.servlet.context-path=/api/v1/notification

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_service
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# JWT Configuration
jwt.secret=cfddd580c0caa2e.2cad8b560cec782369e73960d0089949d314ba4ac0062ba803ce.9201b0da1a80781b7815dc0f99f3e745a66a795db6cda91324f7a055691a5ab689.cfd488e42439ff75a98ccc74a3813662ba45f07deaa5fb05c64a795df76be7d1030.aa5259ae5a7e97d8fbe38a7cd185e59c5ec654aabd70374c4f64e8f5908fe2cf1617bb.6dfb923b98d48f14051f9c4560a2c10a146a1d82fac2651978e0c60786442073682e0626.f7de03959df0429746ba70cce5ef8b941c75325efd64cbed76647881931334889b28c5ee5.e953d74b22a9e05f600157ee0ce541b4011f798bc02479ff19e696c5bbea62b002f12102d.16e10cd2edd4115c8a9a03b
